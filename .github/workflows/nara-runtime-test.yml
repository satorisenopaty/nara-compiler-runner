name: NARA Runtime Test

on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: 'URL ZIP runtime NARA yang akan dibuild'
        required: true
        default: 'https://raw.githubusercontent.com/satorisenopaty/nara-compiler-runner/main/NARA_RUNTIME_TEST_READY.zip'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NARA runtime package
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
        run: |
          curl -fL --retry 3 --retry-delay 2 "$RUNTIME_URL" -o NARA_RUNTIME_REMOTE.zip
          ls -lh NARA_RUNTIME_REMOTE.zip

      - name: Extract NARA runtime package
        run: |
          unzip -o NARA_RUNTIME_REMOTE.zip
          echo "Extracted:"
          find . -maxdepth 3 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nara-runtime-test-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug
      

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
